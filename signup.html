<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Sign-Up</h1>
        <form id="signupForm">
            <input type="text" id="name" placeholder="First Name" required>
            <input type="text" id="family-name" placeholder="Family Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <input type="text" id="userid" placeholder="New User ID" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="password" id="repeat-password" placeholder="Repeat Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <button onclick="window.location.href='signupandlogin.html'">Back</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
